[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
[project]
name = "enJMLX95"
version = "1.0.0"
authors = [
  { name="Aarsh Garg", email="aarshg.13@gmail.com" },
]
description = "enJMLX stands for Encoding using JSON Mapped Lexicon. This is the 95-Character version"
readme = "README.md"
requires-python = ">=3.7"
keywords = ["encoding", "JSON", "coordinates", "ASCII"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]
[project.urls]
"Homepage" = "https://github.com/AarshGarg2011Code/enJMLX-95"
[tool.setuptools.package-data]
"*" = ["*.json"]
